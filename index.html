<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>프로메테우스 회칙 개정안 검토</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top-nav">
      <div class="brand-block">
        <h1>프로메테우스 회칙 개정안 검토</h1>
      </div>
      <button class="mobile-menu-button" id="mobileMenuButton" type="button" aria-controls="headerActions" aria-expanded="false" aria-label="메뉴 열기">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3 4.5h10"></path>
          <path d="M3 8h10"></path>
          <path d="M3 11.5h10"></path>
        </svg>
      </button>
      <div class="toolbar" id="headerActions">
        <button class="icon-button icon-button-secondary" id="presentButton" type="button" title="발표 화면" aria-label="발표 화면">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2.5 3.2h11v7.4h-11V3.2Z"></path>
            <path d="M6.2 13.2 8 10.6l1.8 2.6"></path>
            <path d="M5.2 13.2h5.6"></path>
          </svg>
          <span class="button-label">발표 화면</span>
        </button>
        <button class="icon-button icon-button-secondary" id="printPdfButton" type="button" title="PDF 다운로드" aria-label="PDF 다운로드">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4.2 6V2.7h7.6V6"></path>
            <path d="M4.2 11.2H3A1.2 1.2 0 0 1 1.8 10V7.2A1.2 1.2 0 0 1 3 6h10a1.2 1.2 0 0 1 1.2 1.2V10a1.2 1.2 0 0 1-1.2 1.2h-1.2"></path>
            <path d="M4.2 9.6h7.6v3.7H4.2V9.6Z"></path>
          </svg>
          <span class="button-label">PDF 다운로드</span>
        </button>
        <button class="icon-button icon-button-secondary" id="exportMdButton" type="button" title="신규 회칙 md 다운로드" aria-label="신규 회칙 md 다운로드">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 2.4v7.4"></path>
            <path d="m4.9 6.8 3.1 3 3.1-3"></path>
            <path d="M3.2 12.8h9.6"></path>
          </svg>
          <span class="button-label">신규 회칙 md 다운로드</span>
        </button>
        <button class="icon-button icon-button-secondary" id="loadEnvButton" type="button" title="작업 환경 불러오기" aria-label="작업 환경 불러오기">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3 2.5h6.1l1.4 1.6H13v9.4H3V2.5Z"></path>
            <path d="M5.2 8.4 8 5.8l2.8 2.6"></path>
            <path d="M8 5.8v5.1"></path>
          </svg>
          <span class="button-label">작업 환경 불러오기</span>
        </button>
        <button class="icon-button icon-button-primary" id="saveEnvButton" type="button" title="작업 환경 저장" aria-label="작업 환경 저장">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3 2.5h8.1L13 4.4v9.1H3V2.5Z"></path>
            <path d="M5 2.5v4h5v-4"></path>
            <path d="M5.2 10.2h5.6v3.3H5.2v-3.3Z"></path>
          </svg>
          <span class="button-label">작업 환경 저장</span>
        </button>
      </div>
    </header>

    <main class="app-shell">
      <section class="workspace">
        <div class="board-panel">
          <div id="alignmentBoard" class="alignment-board" aria-live="polite"></div>
          <div
            id="columnDivider"
            class="column-divider"
            role="separator"
            aria-label="좌우 너비 조절"
            aria-orientation="vertical"
            aria-valuemin="28"
            aria-valuemax="72"
            aria-valuenow="50"
            tabindex="0"
          ></div>
        </div>
      </section>
    </main>

    <input id="environmentInput" type="file" accept="application/json,.json" hidden />
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="./app.js" defer></script>
  </body>
</html>
